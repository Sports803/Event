name: Auto-publish OneBall events

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auto-publish-oneball
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Detect, sync, and publish events
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          IMGBB_KEY: ${{ secrets.IMGBB_KEY }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_AUTH_TOKEN: ${{ secrets.FIREBASE_AUTH_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_PUBLIC_WRITE: 'true'
          MAX_POSTS_PER_RUN: '5'
          EVENT_WINDOW_HOURS: '24'
          ACTIVE_GRACE_HOURS: '2'
          MANUAL_SCHEDULE_PATH: 'automation/scheduledEvents'
          MANUAL_WINDOW_HOURS: '24'
          MANUAL_PRIORITY: '1000'
          REFOOTY_AUTO_IMPORT: 'true'
          REFOOTY_RIGHTS_CONFIRMED: 'true'
          REFOOTY_SITEMAP_URL: 'https://refooty.com/sitemap-videos/1.xml'
          REFOOTY_MAX_ITEMS: '10'
          REFOOTY_LOOKBACK_DAYS: '3'
          AI_ENABLED: ${{ vars.AI_ENABLED || 'false' }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_API_URL: ${{ vars.NVIDIA_API_URL || 'https://integrate.api.nvidia.com/v1' }}
          AI_MODEL_MATCHING: ${{ vars.AI_MODEL_MATCHING || 'nvidia/nemotron-3-super-120b-a12b' }}
          AI_MODEL_WRITING: ${{ vars.AI_MODEL_WRITING || 'meta/llama-3.3-70b-instruct' }}
          AI_MODEL_FAST: ${{ vars.AI_MODEL_FAST || 'nvidia/nemotron-3-nano-30b-a3b' }}
          AI_MODEL_REASONING: ${{ vars.AI_MODEL_REASONING || 'openai/gpt-oss-120b' }}
          AI_MODEL_EMBEDDING: ${{ vars.AI_MODEL_EMBEDDING || 'nvidia/nemotron-3-embed-1b' }}
          AI_MAX_CONCURRENCY: '2'
          AI_TIMEOUT_MS: '30000'
          AI_MAX_RETRIES: '2'
          AI_CACHE_ENABLED: 'true'
          AI_CACHE_TTL_HOURS: '168'
          AI_CIRCUIT_BREAKER_ENABLED: 'true'
          AI_CIRCUIT_FAILURE_THRESHOLD: '5'
          AI_CIRCUIT_RESET_MS: '60000'
          AI_MAX_REQUESTS_PER_RUN: '50'
          AI_THINKING_ENABLED: 'true'
          AI_REASONING_BUDGET: '16384'
        run: npm run auto-publish
